[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "comfyui-flux-collection-advanced"
version = "0.4.0"
description = "Advanced Flux, Wan & LTX nodes for ComfyUI with hexagonal architecture"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "imageio",
    "imageio-ffmpeg",
]

[project.urls]
Repository = "https://github.com/StoryWalker/comfyui-flux-collection-advanced"

[tool.setuptools.packages.find]
exclude = ["tests*", "session_context*", "references*"]
